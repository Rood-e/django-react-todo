services:
  # DATABASE (Gestito da Render)
  - type: db
    name: postgres-db
    plan: free
    databaseName: my_app_db
    user: db_user

  # IL BACKEND (Docker)
  - type: web
    name: backend-service
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgres-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DB_HOST
        value: db
      - key: ALLOWED_HOSTS
        value: "*"

  # IL FRONTEND (Docker)
  - type: web
    name: frontend-service
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: Dockerfile.prod
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: backend-service
          property: host
