services:
  # IL BACKEND (Docker)
  - type: web
    name: backend-service
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgres-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"

  # IL FRONTEND (Docker)
  - type: web
    name: frontend-service
    runtime: docker
    plan: free
    dockerContext: ./frontend
    dockerfilePath: Dockerfile.prod
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: backend-service
          property: host

# SEZIONE SEPARATA PER IL DATABASE
databases:
  - name: postgres-db
    plan: free
    databaseName: my_app_db
    user: db_user
